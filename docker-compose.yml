# Project Volusia — Docker Compose

version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app

  # Optional: SearXNG for self-hosted search
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8081:8080"
    environment:
      - INSTANCE_NAME=volusia-search
    volumes:
      - searxng-data:/etc/searxng
    restart: unless-stopped
    profiles:
      - search

volumes:
  searxng-data:
